# ============================================================================
# build-kernel.yml — ZYBO Rev B Linux 内核交叉编译（linux-xlnx 6.6 LTS）
# ============================================================================
# 只做内核：linux-xlnx xlnx_rebase_v6.6_LTS（与 Vivado/Vitis 2024.1 发行配套；
#   官方维护线见 https://github.com/Xilinx/linux-xlnx 分支 xlnx_rebase_v*_LTS）
# + kernel/config.fragment + kernel/zybo-audio.dts（音频 PL 外设 overlay）
# 产物（artifact: kernel-images）：zImage / uImage / zybo-audio.dtb / .config / System.map
# ============================================================================
name: Build ZYBO Linux Kernel

on:
  workflow_dispatch:
  push:
    paths:
      - 'kernel/**'
      - '.github/workflows/build-kernel.yml'

concurrency:
  group: zybo-linux-kernel
  cancel-in-progress: true

env:
  KERNEL_REPO: https://github.com/Xilinx/linux-xlnx.git
  # 与 Vivado/Vitis 2024.1 配套的官方内核 tag（不可变，构建可复现）
  # 该线可选：xlnx_rebase_v6.6_LTS_2024.1（6.6.10）/
  #           xlnx_rebase_v6.6_LTS_2024.1_merge_6.6.80（含上游 stable 修复）← 采用
  KERNEL_REF: xlnx_rebase_v6.6_LTS_2024.1_merge_6.6.80
  ARCH: arm
  CROSS: arm-linux-gnueabihf-
  LOADADDR: '0x8000'

jobs:
  kernel:
    name: Build linux-xlnx kernel for ZYBO
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross toolchain & deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio device-tree-compiler file flex \
            gcc-arm-linux-gnueabihf libncurses-dev libssl-dev u-boot-tools
          arm-linux-gnueabihf-gcc --version | head -1

      - name: Clone linux-xlnx (tag-pinned)
        run: |
          git clone --depth 1 --branch $KERNEL_REF --single-branch \
            $KERNEL_REPO linux/
          cd linux
          echo "ref=$KERNEL_REF" | tee ../kernel-version.txt
          echo "commit=$(git rev-parse HEAD)" | tee -a ../kernel-version.txt
          echo "kernel=$(make ARCH=$ARCH kernelversion 2>/dev/null || echo unknown)" | tee -a ../kernel-version.txt

      - name: Apply device tree overlay + config fragment
        run: |
          # overlay 放到 arch/arm/boot/dts/ 根目录；DTS 内以 xilinx/zynq-zybo.dts 引用板级树
          # （与 Buildroot BR2_LINUX_KERNEL_CUSTOM_DTS_PATH 的落点保持一致）
          cp kernel/zybo-audio.dts linux/arch/arm/boot/dts/zybo-audio.dts
          cp kernel/config.fragment .config.fragment
          cd linux
          make ARCH=$ARCH CROSS_COMPILE=$CROSS xilinx_zynq_defconfig
          # 叠加音频相关配置 fragment
          ./scripts/kconfig/merge_config.sh -m .config ../.config.fragment
          make ARCH=$ARCH CROSS_COMPILE=$CROSS olddefconfig

      - name: Build kernel (zImage + dtb)
        run: |
          cd linux
          make ARCH=$ARCH CROSS_COMPILE=$CROSS -j$(nproc) zImage
          make ARCH=$ARCH CROSS_COMPILE=$CROSS -j$(nproc) zybo-audio.dtb

      - name: Build uImage (U-Boot 启动格式)
        run: |
          cd linux
          make ARCH=$ARCH CROSS_COMPILE=$CROSS LOADADDR=$LOADADDR -j$(nproc) uImage

      - name: Show artifacts
        run: |
          ls -la linux/arch/arm/boot/zImage \
                linux/arch/arm/boot/uImage \
                linux/arch/arm/boot/dts/zybo-audio.dtb \
                linux/.config linux/System.map

      - name: Collect config for the artifact
        run: |
          # upload-artifact v4 默认排除隐藏文件，linux/.config 不会进 artifact；
          # 复制成非隐藏名字，便于事后核对"这个内核到底用了什么配置"。
          cp linux/.config kernel-config.txt
          wc -l kernel-config.txt

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-images
          path: |
            linux/arch/arm/boot/zImage
            linux/arch/arm/boot/uImage
            linux/arch/arm/boot/dts/zybo-audio.dtb
            linux/.config
            kernel-config.txt
            linux/System.map
            kernel-version.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload config/log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-fail-log
          path: |
            linux/.config
          if-no-files-found: ignore
          retention-days: 14

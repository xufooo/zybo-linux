# ============================================================================
# build-kernel.yml — cross-compile the ZYBO Rev B Linux kernel (linux-xlnx 6.6 LTS)
# ============================================================================
# Kernel only: linux-xlnx xlnx_rebase_v6.6_LTS (released with Vivado/Vitis 2024.1;
#   upstream maintenance branches: https://github.com/Xilinx/linux-xlnx xlnx_rebase_v*_LTS)
# + kernel/config.fragment + kernel/zybo-audio.dts (audio PL peripheral overlay)
# Artifacts (artifact: kernel-images): zImage / uImage / zybo-audio.dtb / .config / System.map
# ============================================================================
name: Build ZYBO Linux Kernel

on:
  workflow_dispatch:
  push:
    paths:
      - 'kernel/**'
      - '.github/workflows/build-kernel.yml'

concurrency:
  group: zybo-linux-kernel
  cancel-in-progress: true

env:
  KERNEL_REPO: https://github.com/Xilinx/linux-xlnx.git
  # Official kernel tag matching Vivado/Vitis 2024.1 (immutable, reproducible builds)
  # Candidates on this line: xlnx_rebase_v6.6_LTS_2024.1 (6.6.10) /
  #           xlnx_rebase_v6.6_LTS_2024.1_merge_6.6.80 (includes upstream stable fixes) <- used
  KERNEL_REF: xlnx_rebase_v6.6_LTS_2024.1_merge_6.6.80
  ARCH: arm
  CROSS: arm-linux-gnueabihf-
  LOADADDR: '0x8000'

jobs:
  kernel:
    name: Build linux-xlnx kernel for ZYBO
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross toolchain & deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio device-tree-compiler file flex \
            gcc-arm-linux-gnueabihf libncurses-dev libssl-dev u-boot-tools
          arm-linux-gnueabihf-gcc --version | head -1

      - name: Clone linux-xlnx (tag-pinned)
        run: |
          git clone --depth 1 --branch $KERNEL_REF --single-branch \
            $KERNEL_REPO linux/
          cd linux
          echo "ref=$KERNEL_REF" | tee ../kernel-version.txt
          echo "commit=$(git rev-parse HEAD)" | tee -a ../kernel-version.txt
          echo "kernel=$(make ARCH=$ARCH kernelversion 2>/dev/null || echo unknown)" | tee -a ../kernel-version.txt

      - name: Apply device tree overlay + config fragment
        run: |
          # Place the overlay in the arch/arm/boot/dts/ root; the DTS includes the board
          # tree as xilinx/zynq-zybo.dts (same location as Buildroot
          # BR2_LINUX_KERNEL_CUSTOM_DTS_PATH uses)
          cp kernel/zybo-audio.dts linux/arch/arm/boot/dts/zybo-audio.dts
          cp kernel/config.fragment .config.fragment
          cd linux
          make ARCH=$ARCH CROSS_COMPILE=$CROSS xilinx_zynq_defconfig
          # Merge the audio config fragment
          ./scripts/kconfig/merge_config.sh -m .config ../.config.fragment
          make ARCH=$ARCH CROSS_COMPILE=$CROSS olddefconfig

      - name: Build kernel (zImage + dtb)
        run: |
          cd linux
          make ARCH=$ARCH CROSS_COMPILE=$CROSS -j$(nproc) zImage
          make ARCH=$ARCH CROSS_COMPILE=$CROSS -j$(nproc) zybo-audio.dtb

      - name: Build uImage (U-Boot boot format)
        run: |
          cd linux
          make ARCH=$ARCH CROSS_COMPILE=$CROSS LOADADDR=$LOADADDR -j$(nproc) uImage

      - name: Show artifacts
        run: |
          ls -la linux/arch/arm/boot/zImage \
                linux/arch/arm/boot/uImage \
                linux/arch/arm/boot/dts/zybo-audio.dtb \
                linux/.config linux/System.map

      - name: Collect config for the artifact
        run: |
          # upload-artifact v4 excludes hidden files by default, so linux/.config would
          # not be uploaded; copy it to a non-hidden name for later config inspection.
          cp linux/.config kernel-config.txt
          wc -l kernel-config.txt

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-images
          path: |
            linux/arch/arm/boot/zImage
            linux/arch/arm/boot/uImage
            linux/arch/arm/boot/dts/zybo-audio.dtb
            linux/.config
            kernel-config.txt
            linux/System.map
            kernel-version.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload config/log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-fail-log
          path: |
            linux/.config
          if-no-files-found: ignore
          retention-days: 14
